name: homelab
services:
  hister:
    image: ghcr.io/asciimoo/hister:latest
    container_name: hister
    user: '1000:1000'
    restart: unless-stopped
    volumes:
      - ./hister:/hister/data
    ports:
      - 4433:4433
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4433/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
      - ./searxng/cache:/var/cache/searxng
    environment:
      # Required locally; keep the real value out of chezmoi.
      - SEARXNG_SECRET=dummy
      # - SEARXNG_BASE_URL=http://localhost:8888/
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - searxng-valkey
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - ./searxng-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
