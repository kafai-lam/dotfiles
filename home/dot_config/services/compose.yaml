name: homelab
services:
  hister:
    image: ghcr.io/asciimoo/hister:latest
    container_name: hister
    user: '1000:1000'
    restart: unless-stopped
    volumes:
      - ./hister:/hister/data
    ports:
      - 4433:4433
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4433/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  searxng:
    container_name: searxng
    image: docker.io/searxng/searxng:latest
    restart: always
    ports:
      - "8888:8080"
    volumes:
      - ./searxng:/etc/searxng
      - ./searxng/cache:/var/cache/searxng
    environment:
      # Required locally; keep the real value out of chezmoi.
      - SEARXNG_SECRET=dummy
      # - SEARXNG_BASE_URL=http://localhost:8888/
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - searxng-valkey
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  searxng-valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 30 1 --loglevel warning
    restart: always
    volumes:
      - ./searxng-valkey:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  bifrost:
    container_name: bifrost
    image: maximhq/bifrost
    restart: always
    volumes:
      - ./bifrost:/app/data
    ports:
      - "8080:8080"
    environment:
      - ANTHROPIC_API_KEY=sk-ant-dummy
      - MISTRAL_API_KEY
      - OPENAI_API_KEY=sk-dummy
      - OPENCODE_API_KEY
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      - cli-proxy-api
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

  cli-proxy-api:
    container_name: cli-proxy-api
    image: eceasy/cli-proxy-api
    restart: always
    ports:
      - "8317:8317"
    volumes:
      - ./cli-proxy-api/config.yaml:/CLIProxyAPI/config.yaml
      - ./cli-proxy-api/auths:/root/.cli-proxy-api
      - ./cli-proxy-api/logs:/CLIProxyAPI/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8317 && printf
          "GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 &&
          grep -q "200 OK" <&3'
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
